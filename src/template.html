<style>
/* Layout: situation-room console — header strip, view tabs, a large canvas (globe / network / mind map / matrix / briefing) with a dossier panel docked right; stacks on phones. Deliberately single dark theme. */
:root{
  color-scheme:dark;
  --bg:#0a1018; --panel:#111a25; --panel2:#16212e; --line:#24323f; --ink:#e3e9ee; --muted:#8c9aa8; --dim:#5d6b78;
  --accent:#7fd1ff; --warn:#ffb547; --crit:#ff5c4d; --ok:#5fd39a;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;color:inherit}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px;display:flex;flex-direction:column;gap:12px}
header.top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.8rem,3.4vw,2.6rem);letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--accent)}
.byline{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);letter-spacing:.02em}
.status{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.feed{font-family:var(--f-mono);font-size:.72rem;border:1px solid var(--line);border-radius:3px;padding:3px 8px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;background:var(--panel)}
.feed i{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block}
.feed.ok i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.feed.stale i{background:var(--warn)}
.feed.off i{background:var(--dim)}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden;font-family:var(--f-display);font-weight:700}
.lang button{background:none;border:0;padding:4px 12px;cursor:pointer;color:var(--ink)}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button:focus-visible,.tabs button:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;cursor:pointer;font-family:var(--f-display);font-size:1.08rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:3px 10px;font-size:.8rem;cursor:pointer;color:var(--ink)}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed="false"]{opacity:.4}
.search{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 12px;color:var(--ink);font:inherit;font-size:.85rem;min-width:0;width:200px}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;align-items:start}
.view{position:relative;background:radial-gradient(ellipse at 50% 40%,#122236 0%,var(--bg) 70%);border:1px solid var(--line);border-radius:4px;height:min(74vh,760px);min-height:420px;overflow:hidden}
.view > div[data-v]{position:absolute;inset:0}
.view .scroll{overflow:auto;padding:16px}
.overlay{position:absolute;left:10px;bottom:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:5;max-width:calc(100% - 20px)}
.ovl{font-family:var(--f-mono);font-size:.7rem;background:rgba(10,16,24,.82);border:1px solid var(--line);padding:4px 8px;border-radius:3px;color:var(--muted)}
.toggles{position:absolute;right:10px;top:10px;z-index:5;display:flex;flex-direction:column;gap:4px;background:rgba(10,16,24,.82);border:1px solid var(--line);padding:8px 10px;border-radius:4px;font-size:.78rem}
.toggles label{display:flex;gap:6px;align-items:center;cursor:pointer}
.toggles input{accent-color:var(--accent)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
/* dossier */
aside.panel{background:var(--panel);border:1px solid var(--line);border-radius:4px;max-height:min(74vh,760px);min-height:420px;overflow:auto;display:flex;flex-direction:column}
.p-sec{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.p-sec:last-child{border-bottom:0}
.dom{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:.78rem;font-weight:600}
.p-title{font-family:var(--f-display);font-size:1.6rem;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-family:var(--f-mono);font-size:.68rem;border:1px solid currentColor;border-radius:3px;padding:1px 6px;text-transform:uppercase;letter-spacing:.03em}
.pill.escalating{color:var(--crit)}.pill.active{color:var(--warn)}.pill.latent{color:var(--accent)}.pill.de-escalating{color:var(--ok)}.pill.ended{color:var(--dim)}
.pill.n{color:var(--muted)}
.meter{display:grid;grid-template-columns:90px 1fr 26px;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.meter b{height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;display:block}
.meter b i{display:block;height:100%}
.meter span{font-family:var(--f-mono);text-align:right;color:var(--ink)}
.lbl{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;color:var(--muted);font-weight:600}
.p-sec p{margin:0}
.lnk{display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.lnk button{all:unset;cursor:pointer;display:grid;grid-template-columns:16px minmax(0,1fr);gap:6px;padding:4px 6px;border-radius:3px}
.lnk button:hover,.lnk button:focus-visible{background:var(--panel2)}
.lnk .ar{font-family:var(--f-mono);color:var(--muted)}
.lnk small{display:block;color:var(--muted);font-size:.78rem}
.src{font-size:.8rem;display:flex;flex-direction:column;gap:4px;padding-left:16px;margin:0}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.btn.primary{background:var(--crit);border-color:var(--crit);color:#fff;font-weight:600}
.btn:hover{border-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=range]{accent-color:var(--crit);width:100%}
.casc{display:flex;flex-direction:column;gap:4px;font-size:.84rem}
.casc .c{display:grid;grid-template-columns:44px minmax(0,1fr) 40px;gap:8px;padding:5px 6px;border-left:3px solid var(--line);cursor:pointer}
.casc .c:hover{background:var(--panel2)}
.casc .c .t{font-family:var(--f-mono);color:var(--muted);font-size:.74rem}
.casc .c .v{font-family:var(--f-mono);text-align:right;font-size:.74rem}
.casc small{display:block;color:var(--muted);font-size:.76rem}
.empty{color:var(--muted);font-size:.9rem}
/* matrix + table */
.mx{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.mx svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:3px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:.84rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;background:var(--panel2);cursor:pointer;position:sticky;top:0}
td.n{font-family:var(--f-mono);text-align:right}
tr.sel td{background:#1b2a3a}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--panel2)}
/* briefing */
.brief{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--f-display);font-size:1.25rem;margin:0;letter-spacing:.03em;text-transform:uppercase}
.card ol,.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.top li button{all:unset;cursor:pointer;display:block}
.top li button:hover b{color:var(--accent)}
.top li small{display:block;color:var(--muted);font-size:.8rem}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.84rem}
.chain button{all:unset;cursor:pointer;padding:2px 8px;border-radius:10px;border:1px solid var(--line);background:var(--panel2)}
.chain button:hover{border-color:var(--accent)}
.chain .ar{color:var(--muted)}
.sc{border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.sc b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em}
.sc small{color:var(--muted)}
.alerts{display:flex;flex-direction:column;gap:4px;font-size:.84rem;max-height:260px;overflow:auto}
.alerts div{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px}
.alerts .t{font-family:var(--f-mono);color:var(--muted);font-size:.74rem}
.method{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.method dl{margin:0;display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px 8px;font-size:.86rem}
.method dt{font-family:var(--f-mono);color:var(--accent)}
.method dd{margin:0}
.path{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:rgba(10,16,24,.88);border:1px solid var(--line);border-radius:4px;position:absolute;left:10px;top:10px;z-index:6;max-width:calc(100% - 20px);font-size:.82rem}
.path select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:3px;font:inherit;font-size:.82rem;max-width:170px}
.tip{font-family:var(--f-body);font-size:13px;background:rgba(10,16,24,.94);border:1px solid #2c3d4d;padding:6px 8px;border-radius:3px;max-width:260px;color:var(--ink)}
.tip b{font-family:var(--f-display);font-size:15px}
footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);padding-top:10px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
@media (max-width:1000px){
  .stage{grid-template-columns:minmax(0,1fr)}
  aside.panel{max-height:none;min-height:0}
  .view{height:62vh;min-height:360px}
  .brief,.method,.mx{grid-template-columns:minmax(0,1fr)}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- cascade model ---------- */
function runCascade(src){
  var best={};best[src]={imp:1,t:0,hop:0,prev:null,l:null};
  var frontier=[src];
  while(frontier.length){
    frontier.sort(function(a,b){return best[b].imp-best[a].imp;});
    var cur=frontier.shift();var b=best[cur];
    (OUT[cur]||[]).forEach(function(l){
      if(l.k==="mitigates")return;
      var imp=b.imp*(l.st/3)*0.82*(0.6+byId[cur].sv/12.5);
      var t=b.t+l.lag;
      if(imp<0.06||t>24)return;
      var ex=best[l.t];
      if(!ex||imp>ex.imp+1e-9){best[l.t]={imp:imp,t:t,hop:b.hop+1,prev:cur,l:l};frontier.push(l.t);}
    });
  }
  casc={src:src,best:best};horizon=24;renderPanel();applyCascHl();
}
function applyCascHl(){
  if(!casc){hl=null;}else{hl=new Set();Object.keys(casc.best).forEach(function(k){if(casc.best[k].t<=horizon)hl.add(k);});}
  refreshHl();
}
function renderCasc(){
  var el=document.getElementById("cascl");if(!el||!casc)return;
  var arr=Object.keys(casc.best).filter(function(k){return k!==casc.src;}).map(function(k){return Object.assign({id:k},casc.best[k]);})
    .sort(function(a,b){return a.t-b.t||b.imp-a.imp;});
  el.innerHTML=arr.map(function(r){var n=byId[r.id];var off=r.t>horizon;
    return '<div class="c" data-go="'+r.id+'" style="border-left-color:'+col(n)+';opacity:'+(off?.35:1)+'"><span class="t">+'+r.t+' '+(L==="fr"?"m":"mo")+'</span><span>'+esc(tx(n.t))+'<small>'+esc(tx(byId[r.prev].t))+' → '+esc(tx(r.l.m))+'</small></span><span class="v">'+Math.round(r.imp*100)+'</span></div>';}).join("")||'<p class="empty">—</p>';
}

   .attr("paint-order","stroke").attr("stroke","#0a1018").attr("stroke-width",3)
   .text(function(d){return d.depth===0?"":d.data.name;});
  g.append("text").attr("text-anchor","middle").attr("dy","0.35em").attr("fill","#e3e9ee").attr("font-family","Barlow Condensed, Arial Narrow, sans-serif").attr("font-weight",700).attr("font-size",17).attr("paint-order","stroke").attr("stroke","#0a1018").attr("stroke-width",4).attr("y",-20).text(root.name.toUpperCase());
}

/* ---------- matrix & list ---------- */
var sortK="score",sortD=-1;
function drawMatrix(){
  var el=document.getElementById("v-matrix");
  var ns=NODES.filter(visible);
  var W=520,H=380,m={l:40,r:16,t:16,b:36};
  var jitter={};ns.forEach(function(n){var k=n.sv+"-"+n.lk;jitter[k]=(jitter[k]||0)+1;n._j=jitter[k];});
  var cell=function(v,len,lo,hi){return lo+(v-0.5)/5*(hi-lo);};
  var dots=ns.map(function(n){var cnt=jitter[n.sv+"-"+n.lk];var ang=(n._j/cnt)*Math.PI*2;var rr=cnt>1?13:0;
    var x=cell(n.lk,5,m.l,W-m.r)+Math.cos(ang)*rr, y=cell(6-n.sv,5,m.t,H-m.b)+Math.sin(ang)*rr;
    return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(sel===n.id?8:6)+'" fill="'+col(n)+'" fill-opacity="'+(isHl(n.id)?0.95:0.2)+'" stroke="'+(sel===n.id?"#fff":"#0a1018")+'" stroke-width="1.5" data-go="'+n.id+'" style="cursor:pointer"><title>'+esc(tx(n.t))+'</title></circle>';}).join("");
  var grid="";for(var i=1;i<=5;i++){var x=cell(i,5,m.l,W-m.r),y=cell(6-i,5,m.t,H-m.b);
    grid+='<line x1="'+x+'" x2="'+x+'" y1="'+m.t+'" y2="'+(H-m.b)+'" stroke="#1c2834"/><text x="'+x+'" y="'+(H-m.b+16)+'" text-anchor="middle">'+i+'</text>'+
          '<line y1="'+y+'" y2="'+y+'" x1="'+m.l+'" x2="'+(W-m.r)+'" stroke="#1c2834"/><text x="'+(m.l-10)+'" y="'+(y+3)+'" text-anchor="end">'+i+'</text>';}
  var svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:100%;height:auto" role="img" aria-label="Risk matrix">'+
    '<rect x="'+cell(3.5,5,m.l,W-m.r)+'" y="'+m.t+'" width="'+(W-m.r-cell(3.5,5,m.l,W-m.r))+'" height="'+(cell(2.5,5,m.t,H-m.b)-m.t)+'" fill="rgba(255,92,77,0.07)"/>'+grid+dots+
    '<text x="'+((m.l+W-m.r)/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(u("lik"))+' →</text><text x="12" y="'+((m.t+H-m.b)/2)+'" text-anchor="middle" transform="rotate(-90 12 '+((m.t+H-m.b)/2)+')">'+esc(u("sev"))+' →</text></svg>';
  var rows=ns.slice().sort(function(a,b){var va=sortK==="name"?tx(a.t):sortK==="dom"?tx(DOMAINS[a.d]):a[sortK],vb=sortK==="name"?tx(b.t):sortK==="dom"?tx(DOMAINS[b.d]):b[sortK];return (va>vb?1:va<vb?-1:0)*sortD;});
  var tbl='<div class="tbl"><table><thead><tr><th data-s="name">'+esc(u("name"))+'</th><th data-s="dom">'+esc(u("dom"))+'</th><th data-s="sv">'+esc(u("sev"))+'</th><th data-s="lk">'+esc(L==="fr"?"Prob.":"Lik.")+'</th><th data-s="score">'+esc(u("score"))+'</th><th>'+esc(u("st"))+'</th></tr></thead><tbody>'+
    rows.map(function(n){return '<tr data-go="'+n.id+'" class="'+(sel===n.id?"sel":"")+'"><td><b>'+esc(tx(n.t))+'</b></td><td><span style="color:'+col(n)+'">●</span> '+esc(tx(DOMAINS[n.d]))+'</td><td class="n">'+n.sv+'</td><td class="n">'+n.lk+'</td><td class="n">'+n.score+'</td><td><span class="pill '+n.st+'">'+esc(u("status")[n.st])+'</span></td></tr>';}).join("")+'</tbody></table></div>';
  el.innerHTML='<div class="mx"><div>'+svg+'</div>'+tbl+'</div>';
}
document.getElementById("v-matrix").addEventListener("click",function(e){
  var th=e.target.closest("th[data-s]");if(th){var k=th.dataset.s;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=(k==="name"||k==="dom")?1:-1;}drawMatrix();return;}
  var g=e.target.closest("[data-go]");if(g)select(g.getAttribute("data-go"),false);
});

/* ---------- briefing ---------- */
function drawBrief(){
  var el=document.getElementById("v-brief");
  var top='<div class="card"><h2>'+esc(u("top"))+'</h2><ol class="top">'+BRIEF.top.map(function(id){var n=byId[id];return '<li><button type="button" data-go="'+id+'"><b style="color:'+col(n)+'">'+esc(tx(n.t))+'</b><small>'+esc(tx(n.s)).slice(0,170)+'…</small></button></li>';}).join("")+'</ol></div>';
  var ch='<div class="card"><h2>'+esc(u("chains"))+'</h2>'+BRIEF.chains.map(function(c){return '<div class="chain">'+c.p.map(function(id){var n=byId[id];return '<button type="button" data-go="'+id+'" style="border-color:'+hexA(col(n),.6)+'">'+esc(tx(n.t))+'</button>';}).join('<span class="ar">→</span>')+'</div>';}).join("")+'</div>';
  var sc='<div class="card"><h2>'+esc(u("scen"))+'</h2>'+BRIEF.scen.map(function(s,i){return '<div class="sc" style="border-left-color:'+["#ffb547","#ff5c4d","#5fd39a"][i]+'"><b>'+esc(tx(s.k))+'</b><span>'+esc(s[L])+'</span><small>'+esc(u("signals"))+' : '+esc(tx(s.sig))+'</small></div>';}).join("")+'</div>';
  var bl='<div class="card"><h2>'+esc(u("blind"))+'</h2><ul>'+BRIEF.blind.map(function(b){return '<li>'+esc(tx(b))+'</li>';}).join("")+'</ul></div>';
  var al=liveList();
  var av='<div class="card" style="grid-column:1/-1"><h2>'+esc(u("alerts"))+'</h2>'+(al.length?'<div class="alerts">'+al.map(function(a){return '<div><span class="t">'+esc(a.when)+'</span><span>'+(a.url?'<a href="'+esc(a.url)+'" target="_blank" rel="noopener">'+esc(a.title)+'</a>':esc(a.title))+' <small style="color:var(--muted)">· '+esc(a.src)+'</small></span></div>';}).join("")+'</div>':'<p class="empty">'+esc(u("noalerts"))+'</p>')+'</div>';
  el.innerHTML='<div class="brief">'+top+ch+sc+bl+av+'</div>';
}
document.getElementById("v-brief").addEventListener("click",function(e){var g=e.target.closest("[data-go]");if(g){select(g.dataset.go,false);}});
function liveList(){
  var a=[];live.gdacs.forEach(function(e){a.push(e);});live.quakes.filter(function(e){return e.mag>=5.5;}).forEach(function(e){a.push(e);});live.eonet.slice(0,25).forEach(function(e){a.push(e);});
  return a.sort(function(x,y){return (y.ts||0)-(x.ts||0);}).slice(0,60);
}

/* ---------- method ---------- */
function drawMethod(){
  var el=document.getElementById("v-method");
  var sev=L==="fr"?["Local, limité","National, réversible","Régional, effets économiques notables","Mondial sur un secteur (énergie, alimentation…)","Mondial et systémique, pertes humaines massives"]:["Local, limited","National, reversible","Regional, notable economic effects","Global for one sector (energy, food…)","Global and systemic, mass loss of life"];
  var lik=L==="fr"?["Très improbable (< 5 %)","Peu probable (5–20 %)","Possible (20–50 %)","Probable (50–80 %)","En cours ou quasi certain (> 80 %)"]:["Very unlikely (< 5%)","Unlikely (5–20%)","Possible (20–50%)","Likely (50–80%)","Ongoing or near-certain (> 80%)"];
  var kinds=Object.keys(UI[L].kinds).map(function(k){return '<li><b>'+esc(u("kinds")[k])+'</b></li>';}).join("");
  var feeds=[["USGS","https://earthquake.usgs.gov/earthquakes/feed/v1.0/geojson.php",L==="fr"?"Séismes M4,5+ des 7 derniers jours":"M4.5+ earthquakes, last 7 days"],
   ["NASA EONET","https://eonet.gsfc.nasa.gov/",L==="fr"?"Feux, tempêtes, volcans en cours":"Ongoing wildfires, storms, volcanoes"],
   ["GDACS","https://www.gdacs.org/",L==="fr"?"Alertes catastrophes (ONU / Commission européenne)":"Disaster alerts (UN / European Commission)"],
   ["NOAA SWPC","https://www.swpc.noaa.gov/",L==="fr"?"Indice géomagnétique Kp":"Geomagnetic Kp index"]];
  var allSrc={};NODES.forEach(function(n){n.src.forEach(function(s){allSrc[s[1]]=s[0];});});
  el.innerHTML='<div class="method">'+
   '<div class="card"><h2>'+esc(u("rubricS"))+'</h2><dl>'+sev.map(function(s,i){return '<dt>'+(i+1)+'</dt><dd>'+esc(s)+'</dd>';}).join("")+'</dl></div>'+
   '<div class="card"><h2>'+esc(u("rubricL"))+'</h2><dl>'+lik.map(function(s,i){return '<dt>'+(i+1)+'</dt><dd>'+esc(s)+'</dd>';}).join("")+'</dl></div>'+
   '<div class="card"><h2>'+esc(u("kindsH"))+'</h2><ul>'+kinds+'</ul><p style="margin:0;color:var(--muted);font-size:.86rem">'+(L==="fr"?"Modèle de cascade : l'impact se transmet le long des liens (force du lien × gravité de la source, atténué de 18 % par étape), avec le délai indiqué sur chaque lien. Il illustre des mécanismes ; ce n'est pas une prévision.":"Cascade model: impact passes along links (link strength × source severity, damped 18% per step), with the lag set on each link. It illustrates mechanisms; it is not a forecast.")+'</p></div>'+
   '<div class="card"><h2>'+esc(u("feedsH"))+'</h2><ul>'+feeds.map(function(f){return '<li><a href="'+f[1]+'" target="_blank" rel="noopener">'+f[0]+'</a> — '+esc(f[2])+'</li>';}).join("")+'</ul><p style="margin:0;color:var(--muted);font-size:.86rem">'+esc(u("noalerts"))+'</p></div>'+
   '<div class="card"><h2>'+esc(u("limits"))+'</h2><ul>'+(L==="fr"?["Base établie le "+BASELINE_DATE+" à partir de sources publiques datées ; la situation évolue vite.","Gravité et probabilité sont des jugements de l'atlas, selon l'échelle ci-contre.","Les chiffres de victimes proviennent des autorités ou agences citées et ne peuvent être vérifiés de façon indépendante.","Aucun détail opérationnel militaire n'est fourni."]:["Baseline compiled on "+BASELINE_DATE+" from dated public sources; the situation moves fast.","Severity and likelihood are the atlas's judgements, using the scale shown.","Casualty figures come from the authorities or agencies cited and cannot be independently verified.","No operational military detail is given."]).map(function(x){return '<li>'+esc(x)+'</li>';}).join("")+'</ul></div>'+
   '<div class="card"><h2>'+esc(u("sources"))+' ('+Object.keys(allSrc).length+')</h2><ol class="src">'+Object.keys(allSrc).map(function(k){return '<li><a href="'+esc(k)+'" target="_blank" rel="noopener">'+esc(allSrc[k])+'</a></li>';}).join("")+'</ol></div>'+
   '</div>';
}

/* ---------- tabs & refresh ---------- */
function showTab(t){
  tab=t;
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.t===t);});
  document.querySelectorAll("#view > div[data-v]").forEach(function(d){d.hidden=d.dataset.v!==t;});
  document.getElementById("gtoggles").hidden=t!=="globe";
  document.getElementById("pathbar").hidden=t!=="net";
  if(t==="globe"){if(!G)initGlobe();else sizeGlobe();}
  if(t==="net"){if(!FG)initNet();else sizeNet();if(sel)setTimeout(function(){focusNet(sel);},300);}
  if(t==="mind")drawMind();
  if(t==="matrix")drawMatrix();
  if(t==="brief")drawBrief();
  if(t==="method")drawMethod();
  overlay();
  try{history.replaceState(null,"","#"+t);}catch(e){}
}
document.getElementById("tabs").addEventListener("click",function(e){var b=e.target.closest("button[data-t]");if(b)showTab(b.dataset.t);});
function overlay(){
  var vis=NODES.filter(visible).length;
  var o='<span class="ovl">'+vis+' '+esc(u("nodes"))+' · '+LK.length+' '+esc(u("links"))+'</span>';
  if(["globe","net","mind"].indexOf(tab)<0){document.getElementById("overlay").innerHTML="";return;}
  if(tab==="globe")o+='<span class="ovl">'+esc(u("legendG"))+'</span>';
  if(tab==="globe"&&(live.quakes.length||live.eonet.length))o+='<span class="ovl">'+live.quakes.length+' '+esc(u("quake"))+' · '+live.eonet.length+' EONET · '+live.gdacs.length+' GDACS</span>';
  document.getElementById("overlay").innerHTML=o;
}
function refreshHl(){refreshGlobe();refreshNet(false);if(tab==="mind")drawMind();if(tab==="matrix")drawMatrix();}
function refreshAll(){refreshGlobe();refreshNet(true);if(tab==="mind")drawMind();if(tab==="matrix")drawMatrix();overlay();}
function setLang(l){L=l;try{localStorage.setItem("gra-lang",l);}catch(e){}applyI18n();renderFilters();renderPanel();fillPathSelects();refreshAll();if(tab==="brief")drawBrief();if(tab==="method")drawMethod();}
document.getElementById("lg-fr").addEventListener("click",function(){setLang("fr");});
document.getElementById("lg-en").addEventListener("click",function(){setLang("en");});
window.addEventListener("resize",function(){sizeGlobe();sizeNet();if(tab==="mind")drawMind();});

/* ---------- live feeds ---------- */
function tFetch(url,ms){return Promise.race([fetch(url,{cache:"no-store"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}),new Promise(function(_,rej){setTimeout(function(){rej(new Error("timeout"));},ms||9000);})]);}
function fmt(ts){var d=new Date(ts);return isNaN(d)?"":d.toISOString().slice(5,16).replace("T"," ");}
function badge(id,state,extra){var e=document.getElementById(id);e.className="feed "+state;e.title=extra||"";}
function cacheGet(k){try{var v=JSON.parse(localStorage.getItem("gra-"+k));return v;}catch(e){return null;}}
function cacheSet(k,v){try{localStorage.setItem("gra-"+k,JSON.stringify({at:Date.now(),v:v}));}catch(e){}}
function feed(key,url,parse,badgeId){
  return tFetch(url).then(function(j){var v=parse(j);live[key]=v;cacheSet(key,v);badge(badgeId,"ok",u("updated")+" "+fmt(Date.now()));})
   .catch(function(){var c=cacheGet(key);if(c&&c.v){live[key]=c.v;badge(badgeId,"stale",u("stale")+" "+fmt(c.at));}else badge(badgeId,"off","");});
}
function loadLive(){
  Promise.all([
   feed("quakes","https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/4.5_week.geojson",function(j){return j.features.map(function(f){return {lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],mag:f.properties.mag,title:"M"+f.properties.mag.toFixed(1)+" — "+f.properties.place,src:"USGS",when:fmt(f.properties.time),ts:f.properties.time,url:f.properties.url};});},"fd-usgs"),
   feed("eonet","https://eonet.gsfc.nasa.gov/api/v3/events?status=open&days=30",function(j){var a=[];j.events.forEach(function(ev){var g=ev.geometry&&ev.geometry[ev.geometry.length-1];if(!g)return;var c=g.coordinates;if(Array.isArray(c[0]))c=Array.isArray(c[0][0])?c[0][0]:c[0];a.push({lat:c[1],lng:c[0],title:ev.title+" ("+(ev.categories[0]&&ev.categories[0].title)+")",src:"NASA EONET",when:fmt(g.date),ts:Date.parse(g.date),url:ev.sources&&ev.sources[0]&&ev.sources[0].url});});return a;},"fd-eonet"),
   feed("gdacs","https://www.gdacs.org/gdacsapi/api/events/geteventlist/MAP",function(j){return (j.features||[]).filter(function(f){return f.properties&&(f.properties.alertlevel==="Orange"||f.properties.alertlevel==="Red");}).map(function(f){var c=f.geometry.coordinates;if(Array.isArray(c[0]))c=c[0];var p=f.properties;return {lat:c[1],lng:c[0],lvl:p.alertlevel,title:p.alertlevel+" — "+(p.name||p.eventname||p.eventtype),src:"GDACS",when:fmt(p.fromdate),ts:Date.parse(p.fromdate),url:p.url&&p.url.report};});},"fd-gdacs"),
   tFetch("https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json").then(function(j){var last=j[j.length-1];var kp=Array.isArray(last)?parseFloat(last[1]):parseFloat(last.Kp||last.kp_index);if(isNaN(kp))throw 0;live.kp=kp;cacheSet("kp",kp);document.getElementById("kpv").textContent=kp.toFixed(1);badge("fd-kp",kp>=5?"stale":"ok",u("updated")+" "+fmt(Date.now()));})
    .catch(function(){var c=cacheGet("kp");if(c){document.getElementById("kpv").textContent=(+c.v).toFixed(1);badge("fd-kp","stale",u("stale"));}else badge("fd-kp","off","");})
  ]).then(function(){refreshGlobe();overlay();if(tab==="brief")drawBrief();});
}

/* ---------- boot ---------- */
applyI18n();renderFilters();renderPanel();fillPathSelects();
var h0=(location.hash||"").slice(1);showTab(["globe","net","mind","matrix","brief","method"].indexOf(h0)>=0?h0:"globe");
loadLive();setInterval(loadLive,15*60*1000);
})();
</script>
